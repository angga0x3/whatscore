// Server certificate chain protobuf for the WhatsApp Noise handshake.
// Field numbers follow the wire format recorded in docs/protocol/noise.md
// (PF-009), extracted from reference study of whatsmeow and Baileys on
// 2026-11-15.
//
// The legacy top-level NoiseCertificate variant (issuer/expires/subject
// fields) is intentionally omitted — only the CertChain-nested shape used
// by the handshake verification path is defined here.
syntax = "proto2";

package whatscore.protocol.protobuf;

option go_package = "github.com/angga0x3/whatscore/protocol/protobuf";

message CertChain {
  message NoiseCertificate {
    message Details {
      optional uint32 serial = 1;
      optional uint32 issuerSerial = 2;
      optional bytes key = 3;
      optional uint64 notBefore = 4;
      optional uint64 notAfter = 5;
    }

    optional bytes details = 1;
    optional bytes signature = 2;
  }

  optional NoiseCertificate leaf = 1;
  optional NoiseCertificate intermediate = 2;
}
